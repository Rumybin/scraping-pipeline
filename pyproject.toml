[project]
name = "scraping-pipeline"
version = "0.1.0"
description = "Production-grade, backend-agnostic web scraping pipeline with data-quality gating."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx[http2]>=0.27",
    "selectolax>=0.3",
    "playwright>=1.45",
    "pydantic>=2.7",
    "pandera[polars]>=0.20",
    "polars>=1.5",
    "tenacity>=8.5",
    "pybreaker>=1.2",
    "structlog>=24.4",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "pyarrow>=17.0",
    "duckdb>=1.0",
    "jinja2>=3.1",
    "boto3>=1.34",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "types-pyyaml>=6.0",
    "types-boto3>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
addopts = "--cov=src/pipeline --cov-fail-under=0"
asyncio_mode = "auto"
testpaths = ["tests"]
