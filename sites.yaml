# Registry of scraper plugins the orchestrator fans out to. See
# docs/adr/0001-backend-abstraction.md and src/pipeline/core/sites.py for the loader and schema.
sites:
  - id: books_sandbox
    module: scrapers.books_sandbox:BooksScraper
    enabled: true
    schedule: "0 2 * * *"
    strategy: http
    rate_limit: { rps: 2.0, burst: 5, respect_crawl_delay: true }
    dq_profile: strict
